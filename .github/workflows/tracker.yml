name: Daily Inventory Tracker

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

     - name: Run python tracker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          AS_COLOUR_GRAPHQL_URL: ${{ secrets.AS_COLOUR_GRAPHQL_URL }}  # Make sure this secret exists, or replace it with your actual URL string
          AS_COLOUR_API_TOKEN: ${{ secrets.ASCOLOUR_GRAPHQL_TOKEN }}     # Maps your ASCOLOUR_GRAPHQL_TOKEN secret to the script's variable
        run: python tracker.py
