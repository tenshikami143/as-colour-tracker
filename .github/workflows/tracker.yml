name: AS Colour Inventory Tracker

on:
  schedule:
    # Once a day. GitHub cron is in UTC, format is: minute hour day month weekday
    # To set your time, convert it to UTC. Examples:
    #   9:00 AM Philippines (UTC+8)     ->  '0 1 * * *'
    #   9:00 AM Sydney/Melbourne (AEDT, UTC+11, Oct-Apr)  ->  '0 22 * * *'
    #   9:00 AM Brisbane (AEST, UTC+10) ->  '0 23 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:      # Allows manual trigger from the GitHub Actions tab

jobs:
  track-inventory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tracker
        timeout-minutes: 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tracker.py

      # Safety net: if anything failed and the script didn't already post its own alert
      # (e.g. the install step broke, or the script couldn't even start), tell Discord.
      - name: Notify Discord if the run failed
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -f notified.flag ]; then
            echo "The tracker already sent its own failure alert."
            exit 0
          fi
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\": \"🚨 **TRACKER RUN FAILED!** The workflow stopped before finishing. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL"
