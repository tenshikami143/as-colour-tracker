name: AS Colour Inventory Tracker

on:
  schedule:
    # Runs at 6:00 AM Philippine Time (22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests supabase

      - name: Run Tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          AS_COLOUR_GRAPHQL_URL: ${{ secrets.AS_COLOUR_GRAPHQL_URL }}
          AS_COLOUR_API_TOKEN: ${{ secrets.ASCOLOUR_GRAPHQL_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tracker.py
