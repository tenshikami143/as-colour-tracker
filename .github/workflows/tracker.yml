name: AS Colour Inventory Tracker

on:
  schedule:
    # Wakes up every hour. The script checks the schedule you set in the admin app
    # and only does the real work once a day, at the first check after your chosen time.
    - cron: '0 * * * *'
  workflow_dispatch:      # "Run workflow" button here, or "Run now" in the admin app

concurrency:
  group: as-colour-tracker
  cancel-in-progress: false

jobs:
  track-inventory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tracker
        timeout-minutes: 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # A manual run (button) ignores the schedule and the pause switch
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python tracker.py

      # Safety net: if anything failed and the script didn't already post its own alert
      # (e.g. the install step broke, or the script couldn't even start), tell Discord.
      - name: Notify Discord if the run failed
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -f notified.flag ]; then
            echo "The tracker already sent its own failure alert."
            exit 0
          fi
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\": \"🚨 **TRACKER RUN FAILED!** The workflow stopped before finishing. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL"
